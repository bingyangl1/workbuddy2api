name: Build Windows desktop
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-desktop-lock.txt
      - name: Verify release tag matches desktop version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content desktop/version.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match desktop/version.json' }
      - run: python -m pip install -r requirements-desktop-lock.txt
      - run: python -m unittest discover -s tests -p test_desktop.py -v
      - run: python -m unittest discover -s tests -p "test_sign_release.py" -v
      - run: python scripts/build_desktop.py
      # 签名（P5）：私钥来自 GitHub Secrets，**base64 单行**注入。
      # 为什么必须 base64：私钥是多行 PEM，多行环境变量在 Windows 环境块会被截断
      # （实测踩过：ssh-keygen 报误导性的 "Couldn't load public key ... No such file"）。
      # 未配置 secret 时跳过签名并给出显式提示（不静默产出未签名包）。
      - name: Sign release artifacts
        shell: pwsh
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if (-not $env:RELEASE_SIGNING_KEY) {
            Write-Warning "RELEASE_SIGNING_KEY secret 未配置——跳过签名（发布包将没有 .sig）"
            exit 0
          }
          $files = @(Get-ChildItem dist/*.exe, dist/*.sha256 -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) { throw "dist/ 下没有可签名的产物" }
          python scripts/sign_release.py sign @($files.FullName)
          if ($LASTEXITCODE -ne 0) { throw "签名失败" }
          python scripts/sign_release.py verify @($files.FullName)
          if ($LASTEXITCODE -ne 0) { throw "签名自检失败" }
      - uses: actions/upload-artifact@v4
        with:
          name: WorkBuddy2API-windows-x64
          path: |
            dist/*.exe
            dist/*.sha256
            dist/*.sig
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WorkBuddy2API-windows-x64
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
