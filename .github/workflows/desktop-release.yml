name: Build Windows desktop
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-desktop-lock.txt
      # Node：**必须**，因为 build_desktop.py 要构建 web/out（新面板静态产物）
      # 再打进 EXE。CI 是干净 checkout，没有 web/out，必然会触发 `npm run build`。
      # 之前漏了这两步 → build_desktop.py 在 npm 处失败（实测 run #1 就挂在这）。
      # 用 setup-node 而不是「靠 runner 自带的 Node」：自带版本的 npm/缓存行为
      # 不可控，且不带项目依赖（node_modules 没装）。
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        working-directory: web
        run: npm ci
      - name: Verify release tag matches desktop version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content desktop/version.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match desktop/version.json' }
      - run: python -m pip install -r requirements-desktop-lock.txt
      - run: python -m unittest discover -s tests -p test_desktop.py -v
      # P6 桌面端接入新面板：免密登录白名单 + 落点可配 + 冒烟两种面板。
      # 这几项**必须进 CI**：它们守着「桌面端能不能打开后台」，
      # 而这类故障只在打包后暴露（本地 npm run dev 看不出来）。
      - run: python -m unittest discover -s tests -p test_desktop_panel_p6.py -v
      - run: python -m unittest discover -s tests -p "test_sign_release.py" -v
      - run: python scripts/build_desktop.py
      # 签名（P5）：私钥来自 GitHub Secrets，**base64 单行**注入。
      # 为什么必须 base64：私钥是多行 PEM，多行环境变量在 Windows 环境块会被截断
      # （实测踩过：ssh-keygen 报误导性的 "Couldn't load public key ... No such file"）。
      # 未配置 secret 时跳过签名并给出显式提示（不静默产出未签名包）。
      - name: Sign release artifacts
        shell: pwsh
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if (-not $env:RELEASE_SIGNING_KEY) {
            Write-Warning "RELEASE_SIGNING_KEY secret 未配置——跳过签名（发布包将没有 .sig）"
            exit 0
          }
          Write-Host "已检测到 RELEASE_SIGNING_KEY（$($env:RELEASE_SIGNING_KEY.Length) 字符）"
          # 显式判断目录存在：`Get-ChildItem dist/*.exe` 在 dist/ 缺失时是**终止性错误**，
          # 不是返回空集合——会让这步以「找不到路径」失败，掩盖真正原因。
          if (-not (Test-Path dist)) { throw "build_desktop.py 没有产出 dist/ 目录" }
          # 分别收集再合并：一次 `-Path a, b` 的多通配形式在部分 PowerShell 版本上
          # 行为不一致（实测踩过只收到其中一类），显式两段最稳。
          $files = @(Get-ChildItem -Path dist\*.exe -File -ErrorAction SilentlyContinue) +
                   @(Get-ChildItem -Path dist\*.sha256 -File -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) { throw "dist/ 下没有可签名的产物（.exe / .sha256）" }
          Write-Host "待签名文件："
          $files | ForEach-Object { Write-Host "  - $($_.Name) ($($_.Length) bytes)" }
          python scripts/sign_release.py sign @($files.FullName)
          if ($LASTEXITCODE -ne 0) { throw "签名失败" }
          Write-Host "--- 用仓库内置公钥自检验签 ---"
          python scripts/sign_release.py verify @($files.FullName)
          if ($LASTEXITCODE -ne 0) { throw "签名自检失败" }
          Write-Host "✅ 全部产物已签名并验签通过"
      - uses: actions/upload-artifact@v4
        with:
          name: WorkBuddy2API-windows-x64
          path: |
            dist/*.exe
            dist/*.sha256
            dist/*.sig
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WorkBuddy2API-windows-x64
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
