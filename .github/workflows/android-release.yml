name: Build Android APK

# 安卓 APK 打包（在 GitHub Actions 上跑，本地不需要 Android SDK）。
#
# ## 为什么走 CI
#
# 本地构建需要 JDK 17 + Gradle 8.11.1 + Android SDK 35 + Chaquopy 工具链，
# 首次要下载数 GB。这些在 CI runner 上是现成的（ubuntu-latest 预装了 JDK 与
# Android SDK），本地只需要能 push。
#
# ## 触发方式
#
#   * 打 `v*` tag      → 构建 + 上传到 Release
#   * 手动 workflow_dispatch → 只构建，产物在 Artifacts 里
#
# ## 产物
#
#   WorkBuddy2API-<版本>-android-arm64.apk
#   WorkBuddy2API-<版本>-android-arm64.apk.sha256
#
# ## 签名
#
# 首次构建会在 `build/android-signing/` 生成签名密钥并缓存到 Actions cache
# （后续覆盖升级必须用同一密钥，否则用户无法覆盖安装）。
#
# 也可以显式提供 GitHub Secrets（优先级更高，适合正式发布）：
#   ANDROID_KEYSTORE_BASE64  —— base64 后的 .jks
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# ## 与桌面端的版本号一致
#
# 版本唯一来源是 `desktop/version.json`（双端共享）。
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'android/**'
      - 'scripts/build_android.py'
      - '.github/workflows/android-release.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 8.11.1：与上游验证过的一致（build_android.py 的默认期望）
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify tag matches desktop version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import json, os, sys
          v = json.load(open("desktop/version.json"))["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{v}":
              sys.exit(f"Tag {tag} must match desktop/version.json (v{v})")
          PY

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # ⚠️ 顺序：**先构建面板，再跑启动自检**。
      #
      # 早先反过来了 —— check_runtime 检查 `/panel/` 时 `web/out` 还没生成，
      # 于是 404（CI 上实测踩过）。本地能过是因为开发机早就 build 过了。
      - name: Build web panel
        working-directory: web
        run: |
          npm ci
          NEXT_OUTPUT_EXPORT=1 NEXT_PUBLIC_BASE_PATH=/panel npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      # 安卓运行时只需要 admin/config 与 admin/server 的 import 链能走通 +
      # 面板产物存在。先做一次静态校验 —— 比等到 Gradle 构建二十几分钟后
      # 才发现缺模块划算。
      - name: Preflight check (import chain + staging)
        run: |
          python scripts/check_runtime.py
          python scripts/build_android.py --prepare-only
          test -f android/app/build/generated/python/converter.py
          test -f android/app/build/generated/python/admin/server.py
          echo "staging 文件数: $(find android/app/build/generated/python -type f | wc -l)"

      # ⚠️ 顺序很重要：**先 restore，再决定要不要生成**。
      #
      # 早先写成「先判断有没有 → 没有就生成 → 再 save」，但那时 cache 还没
      # restore 过，即使仓库里已有缓存也会走「生成新密钥」分支 ——
      # 于是每次发版都换密钥，**用户无法覆盖升级**（Android 要求同签名）。
      # ## 签名密钥
      #
      # `scripts/build_android.py` 自己管理签名身份：
      #   * `build/android-signing/signing.json` 存密码
      #   * `build/android-signing/release.jks`  存密钥
      #   * 两者不存在时自动 `keytool -genkeypair` 生成
      #
      # 所以 CI 这边**只需把整个目录缓存起来**，不要重复实现生成逻辑
      #（早先我在这里手写 keytool，与脚本的密码来源打架 —— 已去掉）。
      #
      # ⚠️ 顺序：**先 restore 再构建**。否则每次发版都重新生成密钥，
      # 用户无法覆盖升级（Android 要求同签名）。
      - name: Restore signing identity
        uses: actions/cache/restore@v4
        with:
          path: build/android-signing
          key: android-signing-${{ github.repository }}
          restore-keys: |
            android-signing-${{ github.repository }}

      - name: Build APK
        env:
          # GitHub Actions runner 在海外 —— 用官方 PyPI。
          # `build_android.py` 默认走清华源（对国内开发机友好），
          # 但那在国内镜像对海外 runner 反而超时（实测 ReadTimeout）。
          WB_PIP_INDEX_URL: https://pypi.org/simple
        run: |
          python scripts/build_android.py \
            --gradle "$(which gradle)" \
            --jdk "$JAVA_HOME" \
            --sdk "$ANDROID_HOME"

      # 构建后（首次会自动生成密钥）保存，供下次覆盖升级使用
      - name: Save signing identity
        uses: actions/cache/save@v4
        with:
          path: build/android-signing
          key: android-signing-${{ github.repository }}

      - name: Compute checksum
        run: |
          cd dist/android
          for f in *.apk; do sha256sum "$f" > "$f.sha256"; done
          ls -la

      # **构建 success ≠ 产物可用**。
      #
      # Gradle 退出码 0 只说明「编译过了」，不代表 APK 里有我们的代码。
      # 这一步真的把 APK 当 zip 解剖，确认 `assets/chaquopy/app.imy`
      #（Chaquopy 的源码包）里有 converter.py、admin/server.py、
      # 各路由模块、错误码数据，且**没有**凭证/数据库/密钥。
      - name: Verify APK actually contains our code
        run: |
          set -euo pipefail
          # 先确认 APK 真的存在 —— `cp` 失败时 `set -e` 会立刻退出，
          # 而不是让后面的 pytest 因为「找不到 APK」全靠 skip 而假通过。
          echo "=== dist/android ==="
          ls -la dist/android/
          mkdir -p _apkcheck
          cp dist/android/*.apk _apkcheck/
          echo "=== _apkcheck ==="
          ls -la _apkcheck/
          # 断言至少有一个 APK 被拷过来（防止 skip 掩盖问题）
          count=$(find _apkcheck -name '*.apk' | wc -l)
          echo "APK 数量: $count"
          if [ "$count" -lt 1 ]; then
            echo "::error::没有找到 APK，无法验证产物"
            exit 1
          fi
          # WB_REQUIRE_APK=1：让测试在找不到 APK 时**失败而非跳过**
          WB_REQUIRE_APK=1 python -m pytest tests/test_apk_content.py -q

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            dist/android/*.apk
            dist/android/*.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist/android
      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/android/*.apk
            dist/android/*.sha256
          fail_on_unmatched_files: true
