name: Build Android APK

# 安卓 APK 打包（在 GitHub Actions 上跑，本地不需要 Android SDK）。
#
# ## 为什么走 CI
#
# 本地构建需要 JDK 17 + Gradle 8.11.1 + Android SDK 35 + Chaquopy 工具链，
# 首次要下载数 GB。这些在 CI runner 上是现成的（ubuntu-latest 预装了 JDK 与
# Android SDK），本地只需要能 push。
#
# ## 触发方式
#
#   * 打 `v*` tag      → 构建 + 上传到 Release
#   * 手动 workflow_dispatch → 只构建，产物在 Artifacts 里
#
# ## 产物
#
#   WorkBuddy2API-<版本>-android-arm64.apk
#   WorkBuddy2API-<版本>-android-arm64.apk.sha256
#
# ## 签名
#
# 首次构建会在 `build/android-signing/` 生成签名密钥并缓存到 Actions cache
# （后续覆盖升级必须用同一密钥，否则用户无法覆盖安装）。
#
# 也可以显式提供 GitHub Secrets（优先级更高，适合正式发布）：
#   ANDROID_KEYSTORE_BASE64  —— base64 后的 .jks
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# ## 与桌面端的版本号一致
#
# 版本唯一来源是 `desktop/version.json`（双端共享）。
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'android/**'
      - 'scripts/build_android.py'
      - '.github/workflows/android-release.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 8.11.1：与上游验证过的一致（build_android.py 的默认期望）
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify tag matches desktop version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import json, os, sys
          v = json.load(open("desktop/version.json"))["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{v}":
              sys.exit(f"Tag {tag} must match desktop/version.json (v{v})")
          PY

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 安卓运行时只需要 admin/config 与 admin/server 的 import 链能走通，
      # 先做一次静态校验 —— 比等到 Gradle 构建二十几分钟后才发现缺模块划算。
      - name: Preflight check (import chain + staging)
        run: |
          python scripts/check_runtime.py
          python scripts/build_android.py --prepare-only
          test -f android/app/build/generated/python/converter.py
          test -f android/app/build/generated/python/admin/server.py
          echo "staging 文件数: $(find android/app/build/generated/python -type f | wc -l)"

      - name: Build web panel
        working-directory: web
        run: |
          npm ci
          NEXT_OUTPUT_EXPORT=1 NEXT_PUBLIC_BASE_PATH=/panel npm run build
        env:
          # 面板要打进 APK，必须用静态导出
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Restore or generate signing keystore
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p build/android-signing
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > build/android-signing/release.jks
            echo "using=secrets" >> "$GITHUB_OUTPUT"
          elif [ -f build/android-signing/release.jks ]; then
            echo "using=cached" >> "$GITHUB_OUTPUT"
          else
            # 首次：生成一个密钥。**必须缓存**，否则下次版本无法覆盖安装。
            keytool -genkeypair -v \
              -keystore build/android-signing/release.jks \
              -alias workbuddy2api -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${{ github.run_id }}-wb2api" \
              -keypass "${{ github.run_id }}-wb2api" \
              -dname "CN=WorkBuddy2API, OU=Self-hosted, O=WorkBuddy2API, C=CN"
            echo "using=generated" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore signing cache
        if: steps.signing.outputs.using == 'generated'
        uses: actions/cache/save@v4
        with:
          path: build/android-signing
          key: android-signing-${{ github.repository }}-${{ github.run_id }}

      - name: Restore previous signing cache
        id: signcache
        uses: actions/cache/restore@v4
        with:
          path: build/android-signing
          key: android-signing-${{ github.repository }}
          restore-keys: android-signing-${{ github.repository }}

      - name: Build APK
        run: |
          python scripts/build_android.py \
            --gradle "$(which gradle)" \
            --jdk "$JAVA_HOME" \
            --sdk "$ANDROID_HOME"

      - name: Compute checksum
        run: |
          cd dist/android
          for f in *.apk; do sha256sum "$f" > "$f.sha256"; done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            dist/android/*.apk
            dist/android/*.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist/android
      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/android/*.apk
            dist/android/*.sha256
          fail_on_unmatched_files: true
